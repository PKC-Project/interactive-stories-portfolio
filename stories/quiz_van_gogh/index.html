<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The van Gogh Gauntlet: An Interactive Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="quiz-container">
        <!-- The quiz card that will "flip" -->
        <div id="quiz-card">
            <!-- FRONT OF THE CARD (The Question) -->
            <div id="quiz-front">
                <header id="quiz-header">
                    <h1>The van Gogh Gauntlet</h1>
                    <div id="progress-bar-container"><div id="progress-bar"></div></div>
                    <div id="score-display">Score: 0</div>
                </header>
                <main id="question-area">
                    <h2 id="question-prompt"></h2>
                    <div id="stimulus-container"></div>
                </main>
                <footer id="answer-area"></footer>
            </div>

            <!-- NLD REFINEMENT: BACK OF THE CARD (The Feedback) -->
            <div id="feedback-back">
                <h2 id="feedback-title"></h2>
                <p id="feedback-text"></p>
                <button id="next-question-btn">Next</button>
            </div>
        </div>

        <!-- The results screen, hidden initially -->
        <div id="results-screen" class="hidden">
            <h2>Quiz Complete!</h2>
            <p>Your Final Score:</p>
            <h3 id="final-score"></h3>
            <div class="results-summary">
                <h4>Key Concepts Reviewed:</h4>
                <ul>
                    <li>Brushwork & Impasto</li>
                    <li>Symbolic Color Palette</li>
                    <li>Dynamic Composition</li>
                </ul>
            </div>
            <button id="restart-quiz-btn">Try Again</button>
        </div>
    </div>

    <!-- Hidden SVG Asset Library (Unchanged but included for completeness) -->
    <div id="svg-asset-library" style="display: none;">
        <svg id="q1-van-gogh-stroke" viewBox="0 0 100 100"><defs><filter id="impasto"><feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs><path d="M10 50 C 40 10, 60 90, 90 50" stroke="#ffc400" stroke-width="12" fill="none" filter="url(#impasto)"/><path d="M15 50 C 45 20, 65 80, 95 50" stroke="#2a4d69" stroke-width="6" fill="none" filter="url(#impasto)"/></svg>
        <svg id="q1-sfumato-stroke" viewBox="0 0 100 100"><defs><filter id="blur"><feGaussianBlur stdDeviation="4"/></filter></defs><path d="M10 50 C 40 20, 60 80, 90 50" stroke="#604a39" stroke-width="15" fill="none" filter="url(#blur)"/></svg>
        <svg id="q1-cubist-stroke" viewBox="0 0 100 100"><path d="M10 10 L50 50 L10 90" stroke="#8c6d46" stroke-width="15" fill="none"/><path d="M50 50 L90 10 L90 90 Z" fill="#b08968"/></svg>
        <svg id="q1-pointillism-stroke" viewBox="0 0 100 100"><g fill="#4a7a9e"><circle cx="20" cy="50" r="3"/><circle cx="30" cy="45" r="3"/><circle cx="40" cy="50" r="3"/><circle cx="50" cy="55" r="3"/><circle cx="60" cy="50" r="3"/><circle cx="70" cy="45" r="3"/><circle cx="80" cy="50" r="3"/></g></svg>
        <svg id="q2-night-sky-scene" viewBox="0 0 400 200"><rect width="400" height="200" fill="#000" /><path id="q2-sky-fill-area" d="M0 0 H400 V120 C 300 150, 100 150, 0 120 Z" fill="#555"/><path d="M0 200 H400 V160 C 300 180, 100 180, 0 160 Z" fill="#1a1c2b" /><circle cx="350" cy="50" r="20" fill="#fffbe6"/></svg>
        <svg id="q3-composition-scene" viewBox="0 0 400 200"><rect width="400" height="200" fill="#87ceeb" /><path id="q3-hotspot-sky" class="hotspot" data-correct="true" d="M0 0 H400 V150 H0z"/><path d="M200,75 a60,60 0 1,1 0,1 Z" fill="none" stroke="#ffeb3b" stroke-width="30" style="stroke-dasharray: 10, 5;"/><path id="q3-hotspot-tree" class="hotspot" d="M290 100 H310 V200 H290z"/><path d="M300 100 C 280 80, 320 80, 300 100 C 280 120, 320 120, 300 100z" fill="#006400"/><path d="M300 120 V200" stroke="#5d4037" stroke-width="15" /><path id="q3-hotspot-field" class="hotspot" d="M0 150 H400 V200 H0z"/><path d="M0 200 H400 V150 Z" fill="#ffd700" /><path d="M0 160 H400 M0 170 H400 M0 180 H400 M0 190 H400" stroke="#daa520" opacity="0.5"/></svg>
    </div>

    <script src="script.js"></script>
</body>
</html>
