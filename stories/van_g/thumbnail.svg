<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="sunflowerCenterGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#8B4513;" />
            <stop offset="100%" style="stop-color:#A0522D;" />
        </radialGradient>
        <linearGradient id="sunflowerPetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFD700;" /> <!-- Gold -->
            <stop offset="100%" style="stop-color:#FFA500;" /> <!-- Orange -->
        </linearGradient>
    </defs>
    <rect width="100" height="100" fill="#F0E68C" /> <!-- Creamy yellow background -->
    <!-- Petals -->
    <g transform="translate(50,50)">
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(0)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(30)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(60)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(90)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(120)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(150)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(180)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(210)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(240)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(270)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(300)" />
        <ellipse cx="0" cy="-30" rx="10" ry="20" fill="url(#sunflowerPetalGrad)" transform="rotate(330)" />
    </g>
    <!-- Center -->
    <circle cx="50" cy="50" r="18" fill="url(#sunflowerCenterGrad)" />
</svg>