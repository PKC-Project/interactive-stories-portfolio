<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#F0E4D0" /> <!-- Warm parchment background -->
    <!-- Face Shape -->
    <ellipse cx="50" cy="55" rx="25" ry="30" fill="#E4B9A0" />
    <!-- Hair -->
    <path d="M25,50 Q50,20 75,50 A25,25 0 0 0 25,50 Z" fill="#222222" />
    <!-- Unibrow -->
    <path d="M35,48 Q50,45 65,48" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Flowers in Hair (Simplified) -->
    <circle cx="35" cy="30" r="7" fill="#FF69B4" /> <!-- Pink -->
    <circle cx="50" cy="25" r="8" fill="#FF4500" /> <!-- OrangeRed -->
    <circle cx="65" cy="30" r="7" fill="#FFD700" /> <!-- Gold -->
    <!-- Simple Dress Top -->
    <rect x="30" y="80" width="40" height="20" fill="#800080" /> <!-- Purple -->
</svg>