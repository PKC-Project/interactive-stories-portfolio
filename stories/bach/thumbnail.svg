<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#E0D8C0" /> <!-- Aged paper / light wood -->
    <!-- Simplified Organ Pipes -->
    <rect x="20" y="20" width="10" height="60" fill="#704214" />
    <rect x="35" y="25" width="10" height="50" fill="#8B4513" />
    <rect x="50" y="15" width="10" height="70" fill="#A0522D" />
    <rect x="65" y="30" width="10" height="40" fill="#704214" />
    <rect x="80" y="20" width="10" height="60" fill="#8B4513" />
    <!-- Simple B-A-C-H motif hint -->
    <circle cx="30" cy="85" r="3" fill="#333"/> <!-- B flat (as B) -->
    <circle cx="45" cy="80" r="3" fill="#333"/> <!-- A -->
    <circle cx="60" cy="90" r="3" fill="#333"/> <!-- C -->
    <circle cx="75" cy="75" r="3" fill="#333"/> <!-- H (B natural) -->
</svg>