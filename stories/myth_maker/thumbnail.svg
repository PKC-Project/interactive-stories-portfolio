<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "The Myth Maker's Compendium"
    PKC Project - Style based on the Celestial and Parchment themes
    -->

    <!-- Background -->
    <defs>
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#415a77" />
            <stop offset="100%" stop-color="#0d1b2a" />
        </radialGradient>
    </defs>
    <rect width="400" height="225" fill="url(#bg-grad)" />

    <!-- Ancient Scroll -->
    <g transform="translate(75, 40)">
        <path d="M 0 0 H 250 V 150 H 0 Z" fill="#fdf6e3" stroke="#d3c7ab" stroke-width="1.5" rx="5"/>
        <text x="20" y="40" font-family="Georgia, serif" font-size="16" fill="#586e75">
            <tspan x="20" dy="0">The tale of a hero,</tspan>
            <tspan x="20" dy="20">born in the land of</tspan>
            <tspan x="20" dy="20">__________________.</tspan>
            <tspan x="20" dy="30">They faced the great</tspan>
            <tspan x="20" dy="20">__________________.</tspan>
        </text>
    </g>

    <!-- Magical Quill -->
    <g transform="translate(180, 20) rotate(25)">
        <defs>
            <linearGradient id="quill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#8338ec" />
                <stop offset="100%" stop-color="#4cc9f0" />
            </linearGradient>
            <filter id="glow">
                <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
        <path d="M 100 110 L 100 130 Q 80 100, 100 70 Q 120 100, 100 130" fill="url(#quill-grad)" transform="scale(0.8)" filter="url(#glow)"/>
        <path d="M 98 128 L 80 145" stroke="url(#quill-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    </g>
    
    <!-- Sparkles -->
    <g fill="#ffb703" opacity="0.8">
        <circle cx="50" cy="50" r="2"/>
        <circle cx="350" cy="70" r="3"/>
        <circle cx="60" cy="180" r="3"/>
        <circle cx="330" cy="190" r="2"/>
        <circle cx="200" cy="185" r="1.5"/>
    </g>
</svg>