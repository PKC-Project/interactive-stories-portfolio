<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#F5F5DC" /> <!-- Parchment -->
    <!-- Simplified Vitruvian Man within a circle -->
    <circle cx="50" cy="50" r="40" stroke="#A0522D" stroke-width="1.5" fill="none"/>
    <!-- Head -->
    <circle cx="50" cy="30" r="8" fill="#FFEBCD" stroke="#A0522D" stroke-width="1"/>
    <!-- Body -->
    <line x1="50" y1="38" x2="50" y2="65" stroke="#A0522D" stroke-width="1.5"/>
    <!-- Arms (spread) -->
    <line x1="25" y1="45" x2="75" y2="45" stroke="#A0522D" stroke-width="1.5"/>
    <!-- Legs (spread) -->
    <line x1="50" y1="65" x2="30" y2="85" stroke="#A0522D" stroke-width="1.5"/>
    <line x1="50" y1="65" x2="70" y2="85" stroke="#A0522D" stroke-width="1.5"/>
</svg>