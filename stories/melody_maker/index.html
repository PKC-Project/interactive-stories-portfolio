<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody Maker | A PKC Music Sequencer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="sequencer-container">
        <header class="project-header">
            <h1>Melody Maker</h1>
            <p>Click the grid to place notes. Press Play to hear your creation.</p>
        </header>

        <div class="grid-wrapper">
            <div id="playhead"></div>
            <div id="grid-container">
                <!-- Grid cells will be dynamically generated by script.js -->
            </div>
        </div>

        <div id="controls">
            <button id="play-stop-btn" class="control-button">
                <span class="icon">▶</span>
                <span class="text">Play</span>
            </button>
            
            <div class="slider-container">
                <label for="tempo-slider">Tempo</label>
                <input type="range" id="tempo-slider" min="60" max="240" value="120">
                <span id="tempo-display">120 bpm</span>
            </div>
            
            <button id="instrument-toggle-btn" class="control-button">Sine</button>
            <button id="clear-grid-btn" class="control-button">Clear</button>
        </div>
    </main>
    
    <footer class="project-footer">
        <p>A <a href="https://pkc-project.github.io/interactive-stories-portfolio/" target="_blank">PKC Project</a> exploring procedural audio generation.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
