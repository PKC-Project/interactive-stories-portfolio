<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "Melody Maker"
    PKC Project - Generated by AI
    -->

    <!-- Background -->
    <rect width="400" height="225" fill="#1F2937"/>

    <!-- Sequencer Grid -->
    <g transform="translate(40, 40) rotate(-5)">
        <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- Grid background -->
        <rect x="0" y="0" width="320" height="150" fill="#111827" rx="8"/>

        <!-- Inactive grid cells -->
        <g fill="#4B5563">
            <rect x="15" y="15" width="25" height="25" rx="3"/>
            <rect x="55" y="15" width="25" height="25" rx="3"/>
            <rect x="15" y="45" width="25" height="25" rx="3"/>
            <rect x="135" y="45" width="25" height="25" rx="3"/>
            <rect x="15" y="75" width="25" height="25" rx="3"/>
            <rect x="95" y="75" width="25" height="25" rx="3"/>
            <rect x="175" y="75" width="25" height="25" rx="3"/>
            <rect x="215" y="15" width="25" height="25" rx="3"/>
            <rect x="255" y="45" width="25" height="25" rx="3"/>
            <rect x="295" y="75" width="25" height="25" rx="3"/>
            <rect x="55" y="105" width="25" height="25" rx="3"/>
            <rect x="135" y="105" width="25" height="25" rx="3"/>
            <rect x="215" y="105" width="25" height="25" rx="3"/>
            <rect x="295" y="105" width="25" height="25" rx="3"/>
        </g>

        <!-- Active "Sine" cells (Green) -->
        <g fill="#34d399" filter="url(#glow)">
            <rect x="95" y="15" width="25" height="25" rx="3"/>
            <rect x="55" y="45" width="25" height="25" rx="3"/>
            <rect x="255" y="75" width="25" height="25" rx="3"/>
            <rect x="175" y="105" width="25" height="25" rx="3"/>
        </g>
        
        <!-- Active "Square" cells (Amber) -->
        <g fill="#f59e0b" filter="url(#glow)">
            <rect x="175" y="15" width="25" height="25" rx="3"/>
            <rect x="215" y="45" width="25" height="25" rx="3"/>
            <rect x="135" y="75" width="25" height="25" rx="3"/>
            <rect x="295" y="15" width="25" height="25" rx="3"/>
        </g>
    </g>

    <!-- Floating music note to emphasize audio -->
    <path d="M 320 60 C 320 40, 360 40, 360 60 C 360 80, 320 80, 320 60 Z M 360 60 L 360 140 L 340 140 L 340 120 C 320 120, 300 130, 300 150 C 300 170, 320 180, 340 180" fill="#d1d5db" opacity="0.5"/>

</svg>