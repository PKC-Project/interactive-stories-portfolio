<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#F0F8FF" /> <!-- AliceBlue background -->

    <!-- Two speech bubbles connecting -->
    <path d="M 20,40 A 15,15 0 0 1 35,25 A 15,15 0 0 1 50,40 A 15,15 0 0 1 35,55 L 30,60 L 25,55 A 15,15 0 0 1 20,40 Z" fill="#3498DB" />
    <path d="M 80,60 A 15,15 0 0 0 65,75 A 15,15 0 0 0 50,60 A 15,15 0 0 0 65,45 L 70,40 L 75,45 A 15,15 0 0 0 80,60 Z" fill="#2ECC71" />

    <!-- Connecting line/arrow -->
    <line x1="45" y1="50" x2="55" y2="50" stroke="#555" stroke-width="2" stroke-linecap="round" />
    <polygon points="55,47 60,50 55,53" fill="#555" />

    <!-- Subtle digital/global hint -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <text x="50" y="55" text-anchor="middle" font-size="8px" fill="#777">LF</text>
</svg>