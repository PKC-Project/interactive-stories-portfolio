<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "The Ramen Bowl" (V3 - Accurate Representation)
    A faithful, top-down illustration of the final assembled bowl from the interactive story.
    -->
    <defs>
        <filter id="bowl-shadow-filter"><feDropShadow dx="3" dy="4" stdDeviation="3" flood-opacity="0.25"/></filter>
        <filter id="steam-blur-filter"><feGaussianBlur stdDeviation="1.5"/></filter>
    </defs>

    <!-- Background - A simple, clean tabletop -->
    <rect width="400" height="225" fill="#d7ccc8"/>

    <!-- The Ramen Bowl -->
    <g transform="translate(200, 112.5)" filter="url(#bowl-shadow-filter)">
        <!-- Bowl -->
        <circle r="95" fill="#263238"/>
        <circle r="88" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
        
        <!-- Broth -->
        <circle r="85" fill="#6d4c41"/>
        
        <!-- The Noodle Pile (Recreating the procedural look) -->
        <g id="noodles" fill="none" stroke="#f5e6c4" stroke-width="4" stroke-linecap="round">
            <path d="M -60 20 C -40 50, 40 50, 60 20" />
            <path d="M -55 10 C -30 40, 30 40, 55 10" />
            <path d="M -65 30 C -40 60, 40 60, 65 30" />
            <path d="M -50 0 C -20 -30, 20 -30, 50 0" />
            <path d="M -45 25 C -15 -5, 15 -5, 45 25" />
            <path d="M -60 -10 C -30 -40, 30 -40, 60 -10" />
            <path d="M -55 -20 C -25 -50, 25 -50, 55 -20" />
        </g>
        
        <!-- The Toppings (Placed on top of the noodles) -->
        <g id="toppings">
            <!-- Chashu Pork -->

            <g transform="translate(-25, -20)">
                <ellipse cx="0" cy="0" rx="28" ry="18" fill="#d7ccc8" stroke="#8d6e63" stroke-width="1.5"/>
                <path d="M -15 -5 C 0 -8, 10 -5, 15 0" fill="none" stroke="#bf360c" stroke-width="2"/>
            </g>
            
            <!-- Ajitama Egg -->
            <g transform="translate(40, 10)">
                <circle r="25" fill="#fffde7"/>
                <circle r="12" fill="#ffab00"/>
            </g>
            
            <!-- Green Onions -->
            <g transform="translate(0, 40)" stroke="#4caf50" stroke-width="3" stroke-linecap="round">
                <path d="M -10 0 L 10 10"/>
                <path d="M 0 5 L 20 15"/>
                <path d="M -5 15 L 15 25"/>
            </g>
        </g>
        
        <!-- Steam -->
        <g fill="white" opacity="0.3" filter="url(#steam-blur-filter)">
            <path d="M -30,-30 C -40,-60 -10,-80 0,-110" stroke="white" stroke-width="2" fill="none"/>
            <path d="M 10,-25 C 0,-55 30,-75 40,-105" stroke="white" stroke-width="2" fill="none"/>
        </g>
    </g>
</svg>