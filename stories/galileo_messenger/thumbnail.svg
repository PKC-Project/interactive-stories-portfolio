<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#001f3f" /> <!-- Night Sky Blue -->
    <!-- Telescope -->
    <rect x="10" y="70" width="50" height="10" fill="#808080" transform="rotate(-30 10 70)" />
    <rect x="8" y="68" width="10" height="14" fill="#606060" transform="rotate(-30 10 70)" />
    <line x1="15" y1="80" x2="25" y2="95" stroke="#505050" stroke-width="3"/>
    <line x1="30" y1="80" x2="40" y2="95" stroke="#505050" stroke-width="3"/>
    <!-- Moon -->
    <circle cx="75" cy="25" r="12" fill="white"/>
    <circle cx="82" cy="22" r="12" fill="#001f3f"/>
    <!-- Stars -->
    <circle cx="60" cy="15" r="2" fill="white"/>
    <circle cx="80" cy="45" r="1.5" fill="white"/>
    <circle cx="90" cy="30" r="2.5" fill="white"/>
    <text x="50" y="92" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Galileo</text>
</svg>