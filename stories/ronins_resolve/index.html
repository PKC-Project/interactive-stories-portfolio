<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ronin's Resolve: A Kurosawa Homage</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="vignette-container">
        <!-- The 'camera' or viewport for our film -->
        <div id="camera">
            <!-- The 'set' which will contain all visual elements -->
            <div id="scene">
                <div id="sky"></div>
                <div id="ground"></div>
                <div id="grass-container">
                    <!-- Grass blades will be generated by JS -->
                </div>
                <svg id="ronin-svg" viewBox="0 0 100 200">
                    <path id="ronin-body" d="M 50 200 L 50 80 Q 40 70, 30 75 L 20 150 Z" fill="black"/>
                    <path id="ronin-cloak" d="M 50 90 C 30 100, 20 150, 25 200 L 50 200 Z" fill="#222"/>
                    <path id="ronin-sword-sheath" d="M 48 100 L 20 110" stroke="#111" stroke-width="4"/>
                    <circle id="ronin-head" cx="50" cy="65" r="15" fill="black"/>
                    <!-- The drawn sword, initially hidden -->
                    <path id="ronin-sword-blade" d="M 55 85 Q 150 70, 150 70" stroke="white" stroke-width="3" fill="none" opacity="0"/>
                </svg>
                <div id="rain-container">
                    <!-- Raindrops will be generated by JS -->
                </div>
            </div>
            <!-- On-screen text overlays -->
            <div id="title-card" class="text-overlay"></div>
        </div>

        <!-- The user's only control -->
        <button id="play-button">►</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
