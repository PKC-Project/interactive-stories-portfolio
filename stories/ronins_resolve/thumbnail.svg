<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "The Ronin's Resolve"
    PKC Project - A Kurosawa Homage
    -->

    <defs>
        <filter id="film-grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
            <feColorMatrix type="matrix" values="0 0 0 0 0.5, 0 0 0 0 0.5, 0 0 0 0 0.5, 0 0 0 0.2 0" />
        </filter>
    </defs>

    <!-- Overcast Sky and Dark Ground -->
    <rect width="400" height="150" fill="#888" />
    <rect y="150" width="400" height="75" fill="#444" />

    <!-- The Ronin Silhouette -->
    <g transform="translate(80, 50)">
        <path d="M 50 125 L 50 55 Q 40 45, 30 50 L 20 120 Z" fill="#000"/>
        <path d="M 50 65 C 30 75, 20 120, 25 170 L 50 170 Z" fill="#222"/>
        <circle cx="50" cy="40" r="15" fill="#000"/>
    </g>

    <!-- Windswept Grass -->
    <g fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round">
        <path d="M 20 200 C 40 160, 80 180, 100 150" transform="rotate(-15)" />
        <path d="M 150 210 C 170 170, 210 190, 230 160" transform="rotate(-15)" />
        <path d="M 280 205 C 300 165, 340 185, 360 155" transform="rotate(-15)" />
        <path d="M 50 220 C 70 180, 110 200, 130 170" transform="rotate(-15)" />
        <path d="M 180 225 C 200 185, 240 205, 260 175" transform="rotate(-15)" />
    </g>
    
    <!-- Apply a subtle film grain effect over everything -->
    <rect width="400" height="225" fill="transparent" filter="url(#film-grain)" />

</svg>