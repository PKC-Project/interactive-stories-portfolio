<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "The Digital Roji"
    PKC Project - A minimalist, calming Zen garden theme.
    -->

    <defs>
        <!-- A filter to create a realistic, noisy sand texture -->
        <filter id="sand-texture">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
            <feDiffuseLighting in="noise" lighting-color="#E0D6C8" surfaceScale="1">
                <feDistantLight azimuth="45" elevation="60"/>
            </feDiffuseLighting>
        </filter>

        <!-- A gradient to give the stones a 3D, shaded look -->
        <radialGradient id="stone-gradient" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#8a8a8a" />
            <stop offset="100%" stop-color="#505050" />
        </radialGradient>
    </defs>

    <!-- Background Layer: The Sand -->
    <rect width="400" height="225" fill="#E0D6C8" />
    <rect width="400" height="225" filter="url(#sand-texture)" opacity="0.2" />

    <!-- The Raked Lines (drawn as shadow/highlight pairs for depth) -->
    <g id="rake-lines" stroke-width="2" fill="none" stroke-linecap="round">
        <!-- Shadow Lines -->
        <g stroke="hsla(38, 12%, 60%, 0.5)">
            <path d="M -20,80 C 100,10 300,150 420,50" transform="translate(0.5, 0.5)" />
            <circle cx="100" cy="150" r="30" transform="translate(0.5, 0.5)" />
            <circle cx="100" cy="150" r="45" transform="translate(0.5, 0.5)" />
            <circle cx="100" cy="150" r="60" transform="translate(0.5, 0.5)" />
        </g>
        <!-- Highlight Lines -->
        <g stroke="hsla(38, 33%, 95%, 0.8)">
            <path d="M -20,80 C 100,10 300,150 420,50" transform="translate(-0.5, -0.5)" />
            <circle cx="100" cy="150" r="30" transform="translate(-0.5, -0.5)" />
            <circle cx="100" cy="150" r="45" transform="translate(-0.5, -0.5)" />
            <circle cx="100" cy="150" r="60" transform="translate(-0.5, -0.5)" />
        </g>
    </g>

    <!-- The Stones -->
    <g id="stones">
        <ellipse cx="100" cy="150" rx="18" ry="15" fill="url(#stone-gradient)" style="filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));" />
        <ellipse cx="300" cy="100" rx="25" ry="22" fill="url(#stone-gradient)" style="filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));" />
        <ellipse cx="340" cy="120" rx="15" ry="13" fill="url(#stone-gradient)" style="filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));" />
    </g>

</svg>