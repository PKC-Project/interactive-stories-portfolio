<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simpsons Couch Gag Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gag-container">
        <header>
            <h1>Simpsons Couch Gag Generator!</h1>
        </header>
        <main>
            <div id="svg-canvas-container">
                <svg id="couch-gag-svg-area" width="400" height="250" viewBox="0 0 200 125">
                    <!-- LLM will generate the initial living room SVG here -->
                    <rect width="200" height="125" fill="#FFDB58" id="wall-color"/> <!-- Yellow wall -->
                    <rect y="90" width="200" height="35" fill="#D2B48C" id="floor-color"/> <!-- Floor -->
                    <!-- Couch -->
                    <rect id="couch" x="50" y="70" width="100" height="30" rx="5" ry="5" fill="#D2691E" stroke="#8B4513" stroke-width="1"/>
                    <ellipse cx="75" cy="75" rx="20" ry="8" fill="#A0522D"/>
                    <ellipse cx="125" cy="75" rx="20" ry="8" fill="#A0522D"/>
                    <!-- Boat Painting -->
                    <rect x="70" y="20" width="60" height="35" fill="#ADD8E6" stroke="saddlebrown" stroke-width="1.5"/>
                    <path d="M75 45 Q80 35 90 40 T105 45 L100 50 L80 50 Z" fill="#8B4513"/> <!-- Boat hull -->
                    <line x1="90" y1="40" x2="90" y2="25" stroke="saddlebrown" stroke-width="1"/> <!-- Mast -->
                    <path d="M90 28 L100 32 L90 36 Z" fill="white"/> <!-- Sail -->
                    <!-- Placeholder for characters - JS will add them -->
                    <g id="characters-group"></g>
                </svg>
            </div>
            <div id="controls">
                <button id="new-gag-button">New Couch Gag!</button>
            </div>
            <p id="gag-description"></p>
        </main>
        <footer class="story-footer">
            <button class="nav-button hub-return-button">Back to Gallery</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
