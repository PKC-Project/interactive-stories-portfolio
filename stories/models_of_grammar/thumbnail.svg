<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#E8EAF6" /> <!-- Light Indigo background -->

    <!-- Stylized Tree Diagram / Network Nodes -->
    <circle cx="50" cy="25" r="10" fill="#3F51B5" /> <!-- Root node -->
    <circle cx="25" cy="60" r="8" fill="#4CAF50" /> <!-- Branch 1 -->
    <circle cx="75" cy="60" r="8" fill="#FFC107" /> <!-- Branch 2 -->

    <line x1="50" y1="35" x2="25" y2="52" stroke="#777" stroke-width="1.5" />
    <line x1="50" y1="35" x2="75" y2="52" stroke="#777" stroke-width="1.5" />

    <circle cx="15" cy="85" r="6" fill="#F44336" /> <!-- Leaf 1 -->
    <circle cx="35" cy="85" r="6" fill="#2196F3" /> <!-- Leaf 2 -->
    <circle cx="65" cy="85" r="6" fill="#9C27B0" /> <!-- Leaf 3 -->
    <circle cx="85" cy="85" r="6" fill="#00BCD4" /> <!-- Leaf 4 -->

    <line x1="25" y1="68" x2="15" y2="80" stroke="#777" stroke-width="1" />
    <line x1="25" y1="68" x2="35" y2="80" stroke="#777" stroke-width="1" />
    <line x1="75" y1="68" x2="65" y2="80" stroke="#777" stroke-width="1" />
    <line x1="75" y1="68" x2="85" y2="80" stroke="#777" stroke-width="1" />

    <text x="50" y="50" text-anchor="middle" font-size="8px" fill="#555">Grammar</text>
</svg>