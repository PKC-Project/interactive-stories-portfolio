<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#E0E7EF" /> <!-- Light blue-grey lab background -->
    <!-- Beaker -->
    <path d="M30 80 L30 30 Q30 20 40 20 L60 20 Q70 20 70 30 L70 80 Z" fill="#B0C4DE" stroke="#778899" stroke-width="1.5"/>
    <rect x="28" y="20" width="44" height="5" fill="#B0C4DE" stroke="#778899" stroke-width="1"/> <!-- Beaker rim -->
    <!-- Glowing Element -->
    <circle cx="50" cy="65" r="10" fill="#7FFF00" opacity="0.8"/> <!-- Chartreuse glow -->
    <circle cx="50" cy="65" r="6" fill="#ADFF2F" opacity="0.9"/> <!-- GreenYellow inner glow -->
    <!-- Simple radiation symbol hint -->
    <g transform="translate(50 65) scale(0.15)">
        <circle cx="0" cy="0" r="20" fill="yellow" stroke="black" stroke-width="3"/>
        <path d="M0 -20 V-35 M0 20 V35 M-20 0 H-35 M20 0 H35" stroke="black" stroke-width="4"/>
        <path d="M0 0 L17.32 -10 L17.32 10 Z" transform="rotate(60)" fill="black"/>
        <path d="M0 0 L17.32 -10 L17.32 10 Z" transform="rotate(180)" fill="black"/>
        <path d="M0 0 L17.32 -10 L17.32 10 Z" transform="rotate(300)" fill="black"/>
    </g>
    <text x="50" y="92" font-family="Arial, sans-serif" font-size="9" fill="#465A65" text-anchor="middle">Marie Curie</text>
</svg>