<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "The Monkey King's Heavenly Havoc" (v2 - Master Artist Version)
    PKC Project - A complete narrative scene in the ink wash style.
    -->

    <defs>
        <filter id="mist-filter">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
        </filter>
        <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f3f1e9" />
            <stop offset="100%" stop-color="#e9e5d8" />
        </linearGradient>
    </defs>

    <!-- Background: Textured Rice Paper -->
    <rect width="400" height="225" fill="url(#paper-grad)" />

    <!-- The Red Sun -->
    <circle cx="320" cy="60" r="30" fill="#d94a38" opacity="0.8"/>

    <!-- Background Misty Mountains -->
    <g opacity="0.6" filter="url(#mist-filter)">
        <path d="M 150,225 L 250,120 C 280,100 320,150 420,140 L 420,225 Z" fill="#3d3531" />
    </g>

    <!-- Foreground Mountain -->
    <path d="M -20,225 L 100,100 C 150,50 200,120 250,100 L 420,225 Z" fill="#2a2522" />

    <!-- The Cloud Layer separating Earth and Heaven -->
    <g opacity="0.8" filter="url(#mist-filter)">
        <circle cx="50" cy="100" r="50" fill="white"/>
        <circle cx="150" cy="90" r="60" fill="white"/>
        <circle cx="250" cy="100" r="50" fill="white"/>
        <circle cx="350" cy="95" r="55" fill="white"/>
    </g>

    <!-- The Heavenly Palace -->
    <g id="heaven-gate" transform="translate(175, 20) scale(0.2)">
        <path d="M150,300 L100,250 L150,250 L125,200 L175,200 L150,150 L200,150 L250,200 L225,200 L275,250 L250,250 L300,300 Z" fill="#d94a38" stroke="#c0a080" stroke-width="10"/>
        <rect x="125" y="300" width="150" height="20" fill="#c0a080"/>
    </g>

    <!-- Sun Wukong - The exact model from the story -->
    <g id="wukong" transform="translate(180, 65) scale(0.15)">
         <g transform="translate(250, 600) scale(1.5)">
            <g class="wukong-body">
                <line id="staff" x1="-40" y1="20" x2="40" y2="20" stroke="#1a1e23" stroke-width="12" stroke-linecap="round" transform="rotate(-15)"/>
                <rect x="-10" y="5" width="20" height="30" fill="#c07040" rx="5"/>
                <circle cx="0" cy="0" r="12" fill="#e8b080"/>
                <path d="M-5,-2 C-2,-8 2,-8 5,-2" stroke="black" stroke-width="2.5" fill="none"/>
                <path d="M-8,-5 Q0,-12 8,-5" stroke="#f1c40f" stroke-width="4" fill="none"/>
            </g>
        </g>
    </g>

    <!-- The Red Seal -->
    <g id="seal" transform="translate(20, 20)">
        <rect width="40" height="40" fill="#d94a38" opacity="0.9"/>
        <text x="20" y="28" font-family="serif" font-size="24" fill="#f3f1e9" text-anchor="middle">猴</text> <!-- "Hóu" - Monkey -->
    </g>
</svg>