<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "Astra Leech" (v3 - Particle Nebula Version)
    PKC Project - A faithful representation of the game's visuals.
    -->
    <defs>
        <filter id="ship-glow">
             <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
             <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <radialGradient id="leech-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2ecc71" />
            <stop offset="100%" stop-color="#2ecc71" stop-opacity="0" />
        </radialGradient>
    </defs>

    <!-- Deep Space Background -->
    <rect width="400" height="225" fill="#0a0d14" />
    
    <!-- Twinkling Starfield -->
    <g fill="white" opacity="0.5">
        <circle cx="20" cy="20" r="1.2"/><circle cx="380" cy="200" r="1"/><circle cx="150" cy="150" r="0.8"/>
        <circle cx="250" cy="50" r="1.1"/><circle cx="50" cy="200" r="0.9"/><circle cx="350" cy="20" r="1.3"/>
    </g>

    <!-- The Amoeba Particle Field - A colorful, shimmering cloud -->
    <g id="amoeba-particles" opacity="0.8">
        <circle cx="155" cy="118" r="4" fill="#6a0dad"/>
        <circle cx="230" cy="130" r="5" fill="#c90076"/>
        <circle cx="190" cy="80" r="3" fill="#20b2aa"/>
        <circle cx="280" cy="90" r="4.5" fill="#ff4800"/>
        <circle cx="310" cy="140" r="4" fill="#c90076"/>
        <circle cx="100" cy="150" r="3.5" fill="#6a0dad"/>
        <circle cx="180" cy="165" r="5" fill="#20b2aa"/>
        <circle cx="250" cy="180" r="4" fill="#ff4800"/>
        <circle cx="350" cy="100" r="3" fill="#6a0dad"/>
        <circle cx="80" cy="60" r="4.5" fill="#20b2aa"/>
        <circle cx="210" cy="40" r="4" fill="#c90076"/>
         <circle cx="290" cy="200" r="5" fill="#6a0dad"/>
    </g>
    
    <!-- The Leech Ship, now correctly sized, in the middle of the action -->
    <g transform="translate(180, 130)" filter="url(#ship-glow)">
         <!-- Leeching effect from specific particles -->
        <g stroke-width="1.5" stroke="url(#leech-gradient)">
             <defs>
                <linearGradient id="leech-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2ecc71" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#2ecc71"/>
                </linearGradient>
            </defs>
            <path d="M -35 -40 Q -10 -20 5 0" fill="none" />
            <path d="M -10 35 Q 0 20 5 5" fill="none" />
            <path d="M 40 -60 Q 20 -30 5 0" fill="none" />
        </g>
        <!-- The ship itself -->
        <path d="M0,0 L20,10 L0,20 L5,10 Z" fill="#3498db"/>
    </g>
</svg>