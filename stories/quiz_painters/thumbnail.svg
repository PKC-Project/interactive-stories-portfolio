    <rect x="55" y="55" width="30" height="6" rx="2" fill="#654321" transform="rotate(-30 70 58)" />
    <path d="M 78 42 L 85 35 L 90 40 Z" fill="#4A4A4A" transform="rotate(-30 70 58)" />
