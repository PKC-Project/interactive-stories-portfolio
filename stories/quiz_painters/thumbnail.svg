    <path d="M 30 70 Q 10 50, 30 30 Q 50 10, 70 30 Q 90 50, 70 70 Q 50 90, 30 70 Z" fill="#8B4513" />
    <circle cx="35" cy="38" r="5" fill="#FF0000" /> <!-- Red paint -->
    <circle cx="50" cy="30" r="5" fill="#0000FF" /> <!-- Blue paint -->
    <circle cx="65" cy="38" r="5" fill="#FFFF00" /> <!-- Yellow paint -->
    <circle cx="60" cy="55" r="5" fill="#008000" /> <!-- Green paint -->
