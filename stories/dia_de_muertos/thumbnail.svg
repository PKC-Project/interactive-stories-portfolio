<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#FFC0CB"/> <!-- Light Pink background -->
    <!-- Skull shape -->
    <path d="M 25 30 Q 50 10 75 30 C 85 45 85 70 75 85 Q 50 95 25 85 C 15 70 15 45 25 30 Z" fill="white" stroke="#663300" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="40" cy="40" r="8" fill="#FF8C00"/> <!-- Orange eye -->
    <circle cx="60" cy="40" r="8" fill="#FF8C00"/>
    <!-- Nose -->
    <path d="M 50 50 L 45 58 L 55 58 Z" fill="#663300"/>
    <!-- Mouth (stitches) -->
    <line x1="35" y1="70" x2="65" y2="70" stroke="#663300" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="67" x2="40" y2="73" stroke="#663300" stroke-width="1"/>
    <line x1="50" y1="67" x2="50" y2="73" stroke="#663300" stroke-width="1"/>
    <line x1="60" y1="67" x2="60" y2="73" stroke="#663300" stroke-width="1"/>
    <!-- Forehead decoration -->
    <circle cx="50" cy="25" r="4" fill="#FF0000"/>
    <circle cx="40" cy="28" r="3" fill="#0000FF"/>
    <circle cx="60" cy="28" r="3" fill="#00FF00"/>
    <text x="50" y="92" font-family="Arial, sans-serif" font-size="8" fill="#333" text-anchor="middle">Día de Muertos</text>
</svg>