<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="momoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFB6C1;" /> <!-- Peach Pink -->
            <stop offset="50%" style="stop-color:#87CEEB;" /> <!-- Sky Blue (River/Journey) -->
            <stop offset="100%" style="stop-color:#2F4F4F;" /> <!-- Dark Slate Gray (Ogres) -->
        </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#momoGrad)" />
    <!-- Symbolic Shapes -->
    <circle cx="30" cy="30" r="10" fill="white" opacity="0.7"/> <!-- Purity/Hero -->
    <polygon points="70,60 85,80 55,80" fill="#FF4500" opacity="0.7"/> <!-- Strength/Courage (Triangle) -->
    <text x="50" y="55" font-family="Impact, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle" transform="rotate(-10 50 50)">桃</text> <!-- Momo (Peach) character -->
</svg>