<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lexicon's Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>

    <div id="journey-container">
        <!-- The main display area for the word -->
        <div id="word-display">
            <h1 id="word-text">Captain</h1>
        </div>

        <!-- The information panel for text descriptions -->
        <div id="info-panel">
            <h2 id="era-title">Modern English</h2>
            <p id="era-description">The commander of a vessel, such as a ship or aircraft. Also used more broadly for a leader of a team or group. Its strong naval connotation is its most recognized modern meaning.</p>
        </div>

        <!-- Navigation controls -->
        <div id="navigation">
            <button id="prev-btn" class="nav-btn" disabled>< Prev</button>
            <button id="next-btn" class="nav-btn">Next ></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
