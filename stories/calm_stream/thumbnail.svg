<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail Design 3: The Focusing Lens
    Metaphor: Clarity, mental focus, simplifying the mind.
    -->
    <defs>
        <radialGradient id="lens-gradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2a3b4f" />
            <stop offset="100%" stop-color="#080c10" />
        </radialGradient>
    </defs>

    <!-- Background -->
    <rect width="400" height="225" fill="#080c10" />

    <!-- The Lens Rings -->
    <g transform="translate(200, 112.5)" fill="none" stroke="#7d9ab8" stroke-width="1">
        <!-- Each circle has a dash array to create gaps, rotated for variety -->
        <circle r="40" stroke-dasharray="188.4 62.8" transform="rotate(15)" /> <!-- 75% on, 25% off -->
        <circle r="65" stroke-dasharray="102.1 306.3" transform="rotate(-30)" opacity="0.7"/> <!-- 25% on -->
        <circle r="90" stroke-dasharray="282.6 282.6" transform="rotate(45)" opacity="0.4"/> <!-- 50% on -->
    </g>
    
    <!-- Central Soft Light -->
    <circle cx="200" cy="112.5" r="30" fill="url(#lens-gradient)" />
</svg>