<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "Newton's Sandbox"
    PKC Project - Visualizing orbital mechanics and user interaction
    -->

    <defs>
        <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff" />
            <stop offset="70%" stop-color="#ffd700" />
            <stop offset="100%" stop-color="#ffd700" stop-opacity="0" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Deep space background -->
    <rect width="400" height="225" fill="#0d1b2a" />
    
    <!-- Background stars -->
    <g fill="#e0e1dd" opacity="0.5">
        <circle cx="50" cy="50" r="1"/>
        <circle cx="350" cy="70" r="1.5"/>
        <circle cx="60" cy="180" r="1.2"/>
        <circle cx="330" cy="190" r="1"/>
        <circle cx="100" cy="100" r="0.8"/>
        <circle cx="280" cy="40" r="1.1"/>
        <circle cx="150" cy="200" r="1.3"/>
    </g>

    <!-- Central Star -->
    <circle cx="200" cy="112.5" r="30" fill="url(#star-glow)" />

    <!-- Planet and its Orbital Trail -->
    <g filter="url(#glow)">
        <!-- The trail -->
        <path d="M 100,112.5 A 100,70 0 1,1 300,112.5 A 100,70 0 1,1 100,112.5" 
              stroke="#4cc9f0" stroke-width="2.5" fill="none" />
        <!-- The planet -->
        <circle cx="100" cy="112.5" r="6" fill="#4cc9f0" stroke="#fff" stroke-width="1"/>
    </g>

    <!-- User Interaction Hint: The launch vector -->
    <g>
        <line x1="350" y1="50" x2="300" y2="90" stroke="#fff" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
        <circle cx="350" cy="50" r="3" fill="#fff" opacity="0.8"/>
    </g>
</svg>