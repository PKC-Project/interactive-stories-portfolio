<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "The Algorithmic Easel"
    PKC Project - Generated by AI
    -->

    <!-- Background -->
    <rect width="400" height="225" fill="#f8f9fa"/>

    <!-- Stylized Canvas -->
    <g transform="translate(75, 25)">
        <rect width="250" height="175" fill="#ffffff" stroke="#dee2e6" stroke-width="4" rx="5"/>
        <defs>
            <clipPath id="canvas-clip">
                <rect width="250" height="175" rx="5"/>
            </clipPath>
        </defs>

        <!-- Generated Art spilling out, clipped by the canvas -->
        <g clip-path="url(#canvas-clip)" transform="translate(10, 10)">

            <!-- Geometric Shapes (based on Oceanic Blues) -->
            <circle cx="50" cy="130" r="30" fill="#0a9396" opacity="0.8"/>
            <rect x="20" y="20" width="60" height="40" fill="#94d2bd" opacity="0.9" transform="rotate(-15, 50, 40)"/>

            <!-- Flowing Curves (based on Neon Dreams) -->
            <path d="M 0 80 Q 100 180, 200 120" stroke="#8338ec" stroke-width="8" fill="none" opacity="0.7"/>
            <path d="M 250 50 Q 150 -50, 50 80" stroke="#ff006e" stroke-width="6" fill="none" opacity="0.8"/>

            <!-- Chaotic Strokes (based on Sunset Warmth) -->
            <line x1="180" y1="10" x2="240" y2="160" stroke="#f94144" stroke-width="4" opacity="0.9"/>
            <line x1="150" y1="175" x2="230" y2="20" stroke="#f3722c" stroke-width="3" opacity="0.8"/>
            <line x1="80" y1="10" x2="160" y2="150" stroke="#f9c74f" stroke-width="5" opacity="0.9"/>

        </g>
    </g>

    <!-- Stylized Paintbrush -->
    <g transform="translate(280, 140) rotate(30)">
        <rect x="0" y="0" width="100" height="15" fill="#8d6e63" rx="3"/>
        <rect x="100" y="-2.5" width="20" height="20" fill="#adb5bd" rx="2"/>
        <path d="M 120 0 L 140 10 L 120 20 Z" fill="#007bff"/>
    </g>

</svg>