<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Portal Gun: Interdimensional Cable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-container">
        <!-- The initial state with the clickable portal gun -->
        <div id="standby-screen" class="screen active">
            <div id="portal-gun-container">
                <!-- Simplified Portal Gun SVG -->
                <svg id="portal-gun" viewBox="0 0 200 100">
                    <rect x="40" y="35" width="120" height="30" fill="#d0d0d0" rx="5"/>
                    <rect x="160" y="40" width="30" height="20" fill="#333"/>
                    <circle cx="30" cy="50" r="10" fill="#333"/>
                    <rect x="70" y="25" width="60" height="10" fill="#555"/>
                    <circle id="portal-gun-light" cx="100" cy="15" r="8" fill="#88ff00" stroke="white" stroke-width="2"/>
                </svg>
            </div>
            <h2 id="prompt-text">Wubba Lubba Dub Dub!</h2>
            <p>Fire the Portal Gun</p>
        </div>

        <!-- The container for the portal transition effect -->
        <div id="transition-screen" class="screen">
            <svg id="portal-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
                <filter id="portal-filter">
                    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="2" seed="1" result="turbulence"/>
                    <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="50" />
                </filter>
                <ellipse cx="400" cy="300" rx="0" ry="0" fill="#88ff00" filter="url(#portal-filter)"/>
            </svg>
        </div>

        <!-- The screen that displays the generated dimension -->
        <div id="dimension-screen" class="screen">
            <div id="dimension-background"></div>
            <div id="title-card">
                <h3 id="show-title"></h3>
                <p id="show-logline"></p>
            </div>
            <button id="restart-btn">Go to a new dimension!</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
