<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="crystalGlowEldoriaThumb" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:aqua; stop-opacity:1;" />
            <stop offset="60%" style="stop-color:cyan; stop-opacity:0.8;" />
            <stop offset="100%" style="stop-color:rgba(0,255,255,0); stop-opacity:0;" />
        </radialGradient>
    </defs>
    <!-- Background - Dark forest/cave entrance -->
    <rect width="100" height="100" fill="#2A221B" />
    <path d="M 0 100 Q 50 30 100 100 Z" fill="#3A2F2F" />
    <path d="M 10 100 Q 50 40 90 100 Z" fill="#4A3B31" />

    <!-- Crystal -->
    <polygon points="50,25 65,45 50,65 35,45" fill="#B0E0E6" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="50" cy="45" r="25" fill="url(#crystalGlowEldoriaThumb)" />
    <polygon points="50,25 65,45 50,65 35,45" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.5"/>


    <!-- Subtle sparkles -->
    <circle cx="30" cy="30" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="70" cy="35" r="1" fill="white" opacity="0.6"/>
    <circle cx="50" cy="75" r="1.2" fill="white" opacity="0.8"/>
    <circle cx="65" cy="20" r="1" fill="white" opacity="0.5"/>
</svg>