<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "Seurat's Sunday Dot"
    Metaphor: A magnifying glass revealing the individual dots that form a single color.
    -->
    <defs>
        <filter id="paper-texture">
            <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" result="turbulence"/>
            <feDisplacementMap in="SourceGraphic" scale="1"/>
        </filter>
        <clipPath id="magnifying-lens">
            <circle cx="260" cy="112.5" r="70"/>
        </clipPath>
    </defs>

    <!-- Background (textured paper) -->
    <rect width="400" height="225" fill="#f4f1e9" filter="url(#paper-texture)"/>

    <!-- The field of dots (optically green) -->
    <g id="dot-field">
        <!-- Blue dots -->
        <circle cx="50" cy="50" r="1.5" fill="#4a7a9e"/> <circle cx="100" cy="100" r="1.5" fill="#4a7a9e"/>
        <circle cx="150" cy="150" r="1.5" fill="#4a7a9e"/> <circle cx="200" cy="50" r="1.5" fill="#4a7a9e"/>
        <circle cx="250" cy="170" r="1.5" fill="#4a7a9e"/> <circle cx="350" cy="80" r="1.5" fill="#4a7a9e"/>
        <!-- Yellow dots -->
        <circle cx="70" cy="120" r="1.5" fill="#f4d58d"/> <circle cx="120" cy="60" r="1.5" fill="#f4d58d"/>
        <circle cx="180" cy="180" r="1.5" fill="#f4d58d"/> <circle cx="230" an="cy" r="80" fill="#f4d58d"/>
        <circle cx="300" cy="130" r="1.5" fill="#f4d58d"/> <circle cx="380" cy="190" r="1.5" fill="#f4d58d"/>
    </g>

    <!-- The dots as seen through the magnifying glass (larger) -->
    <g clip-path="url(#magnifying-lens)">
        <rect width="400" height="225" fill="#f4f1e9"/> <!-- Background for inside lens -->
        <g id="magnified-dots">
            <circle cx="210" cy="90" r="4" fill="#4a7a9e"/> <circle cx="250" cy="150" r="4" fill="#4a7a9e"/>
            <circle cx="300" cy="80" r="4" fill="#4a7a9e"/> <circle cx="330" cy="140" r="4" fill="#4a7a9e"/>
            <circle cx="220" cy="140" r="4" fill="#f4d58d"/> <circle cx="280" cy="60" r="4" fill="#f4d58d"/>
            <circle cx="290" cy="120" r="4" fill="#f4d58d"/> <circle cx="240" cy="70" r="4" fill="#f4d58d"/>
        </g>
    </g>
    
    <!-- The magnifying glass frame -->
    <g id="magnifier" fill="none" stroke="#3d352e" stroke-width="8">
        <circle cx="260" cy="112.5" r="70"/>
        <path d="M 205,167.5 L 140,232.5" stroke-linecap="round"/>
    </g>
</svg>