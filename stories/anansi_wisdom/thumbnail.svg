<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#F4A460" /> <!-- Sandy Brown / Earthy Orange -->
    <!-- Anansi (Spider) -->
    <circle cx="50" cy="40" r="15" fill="#4A3B31" /> <!-- Body -->
    <circle cx="50" cy="25" r="8" fill="#3D2B1F" /> <!-- Head -->
    <!-- Legs (simplified) -->
    <line x1="35" y1="40" x2="15" y2="30" stroke="#3D2B1F" stroke-width="3"/>
    <line x1="35" y1="45" x2="15" y2="55" stroke="#3D2B1F" stroke-width="3"/>
    <line x1="38" y1="50" x2="20" y2="70" stroke="#3D2B1F" stroke-width="3"/>
    <line x1="65" y1="40" x2="85" y2="30" stroke="#3D2B1F" stroke-width="3"/>
    <line x1="65" y1="45" x2="85" y2="55" stroke="#3D2B1F" stroke-width="3"/>
    <line x1="62" y1="50" x2="80" y2="70" stroke="#3D2B1F" stroke-width="3"/>
    <!-- Pot of Wisdom -->
    <ellipse cx="50" cy="75" rx="20" ry="15" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>
    <rect x="40" y="58" width="20" height="5" fill="#CD853F" stroke="#8B4513" stroke-width="1.5"/>
    <text x="50" y="95" font-family="Arial, sans-serif" font-size="9" fill="#4A3B31" text-anchor="middle">Anansi</text>
</svg>