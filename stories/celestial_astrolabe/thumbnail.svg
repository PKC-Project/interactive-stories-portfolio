<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
    <!-- 
    Thumbnail for "The Celestial Astrolabe"
    PKC Project - A classic, colorful astrophotography theme.
    -->

    <defs>
        <!-- A filter to give the trails a soft, photographic glow -->
        <filter id="star-glow">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <!-- Subtle background texture -->
        <radialGradient id="sky-vignette" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#1a1e23" />
            <stop offset="100%" stop-color="#00000a" />
        </radialGradient>
    </defs>

    <!-- Background -->
    <rect width="400" height="225" fill="url(#sky-vignette)" />

    <!-- The Star Trails -->
    <g id="trails" filter="url(#star-glow)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8">
        <!-- Inner trails (shorter) -->
        <path d="M 200,55 A 40,40 0 1,1 199.9,55 Z" stroke="#a8dadc" />
        <path d="M 200,85 A 70,70 0 1,0 200.1,85 Z" stroke="#ffc0cb" transform="rotate(20 200 85)" />

        <!-- Mid trails -->
        <path d="M 200,125 A 110,110 0 1,1 199.9,125 Z" stroke="#8e44ad" transform="rotate(-30 200 125)" />
        <path d="M 200,155 A 140,140 0 1,0 200.1,155 Z" stroke="#3498db" />

        <!-- Outer trails (longer arcs) -->
        <path d="M -50,150 A 250,250 0 0,1 450,150" stroke="#f1c40f" />
        <path d="M -50,180 A 280,280 0 0,1 450,180" stroke="#e67e22" transform="rotate(5)" />
    </g>

    <!-- The central "pole star", which is almost stationary -->
    <circle cx="200" cy="15" r="2" fill="white" />
</svg>